<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="catHeadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Left Outer & Inner Pink Ear -->
  <polygon points="14,40 28,10 40,36" fill="#ea580c" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="18,37 28,16 36,34" fill="#f472b6"/>

  <!-- Right Outer & Inner Pink Ear -->
  <polygon points="86,40 72,10 60,36" fill="#ea580c" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="82,37 72,16 64,34" fill="#f472b6"/>

  <!-- Main Cat Head Circle (Fills the frame for max readability) -->
  <circle cx="50" cy="54" r="40" fill="url(#catHeadGrad)" stroke="#7c2d12" stroke-width="3.5"/>

  <!-- Expressive Emerald Green Cat Eyes -->
  <ellipse cx="34" cy="50" rx="10" ry="11" fill="#10b981"/>
  <ellipse cx="66" cy="50" rx="10" ry="11" fill="#10b981"/>

  <!-- Pupil Slits -->
  <rect x="32.5" y="42" width="3" height="16" rx="1.5" fill="#000000"/>
  <rect x="64.5" y="42" width="3" height="16" rx="1.5" fill="#000000"/>

  <!-- Eye Sparkles -->
  <circle cx="31" cy="46" r="3" fill="#ffffff"/>
  <circle cx="63" cy="46" r="3" fill="#ffffff"/>

  <!-- Cute Pink Triangle Nose -->
  <polygon points="44,63 56,63 50,69" fill="#f472b6"/>

  <!-- Cat Mouth -->
  <path d="M50,69 L50,71 Q43,76 36,72 M50,71 Q57,76 64,72" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- White Cat Whiskers -->
  <path d="M24,60 L4,55 M24,65 L2,65 M24,70 L6,75" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  <path d="M76,60 L96,55 M76,65 L98,65 M76,70 L94,75" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>

  <!-- Golden Bell Accent at Bottom -->
  <circle cx="50" cy="88" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>
  <circle cx="47.5" cy="85.5" r="2" fill="#fef08a"/>
  <circle cx="50" cy="89" r="1.5" fill="#78350f"/>
</svg>
