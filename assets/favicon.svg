<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="catGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background Cat Face Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#catGrad)" stroke="#7c2d12" stroke-width="3"/>

  <!-- Left Ear -->
  <polygon points="18,34 32,10 40,30" fill="#ea580c" stroke="#7c2d12" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="22,32 32,16 37,29" fill="#f472b6"/>

  <!-- Right Ear -->
  <polygon points="82,34 68,10 60,30" fill="#ea580c" stroke="#7c2d12" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="78,32 68,16 63,29" fill="#f472b6"/>

  <!-- Fisherman Bucket Hat -->
  <rect x="22" y="16" width="56" height="12" rx="4" fill="#eab308"/>
  <rect x="30" y="4" width="40" height="16" rx="3" fill="#eab308"/>
  <rect x="30" y="14" width="40" height="5" fill="#ef4444"/>

  <!-- Emerald Green Cat Eyes -->
  <ellipse cx="36" cy="56" rx="9" ry="10" fill="#10b981"/>
  <ellipse cx="64" cy="56" rx="9" ry="10" fill="#10b981"/>
  <rect x="34.5" y="49" width="3" height="14" rx="1.5" fill="#000000"/>
  <rect x="62.5" y="49" width="3" height="14" rx="1.5" fill="#000000"/>

  <!-- Eye Sparkles -->
  <circle cx="33" cy="52" r="2.5" fill="#ffffff"/>
  <circle cx="61" cy="52" r="2.5" fill="#ffffff"/>

  <!-- Cute Pink Triangle Nose -->
  <polygon points="45,68 55,68 50,73" fill="#f472b6"/>

  <!-- Cat Mouth -->
  <path d="M50,73 Q44,79 38,75 M50,73 Q56,79 62,75" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- White Whiskers -->
  <path d="M26,64 L10,60 M26,68 L8,68 M26,72 L12,76" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M74,64 L90,60 M74,68 L92,68 M74,72 L88,76" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
